<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Train</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f14'/%3E%3Crect x='7' y='11' width='18' height='10' rx='4' fill='%23e6a340'/%3E%3Crect x='17' y='14' width='4' height='4' rx='1.4' fill='%230b0f14'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Focus Train">
<meta name="theme-color" content="#0b0f14">
<script>
/* Apply the saved theme before first paint so there is no flash. */
try{
  var _st = JSON.parse(localStorage.getItem("focus-train-v1") || "{}");
  document.documentElement.setAttribute("data-theme", (_st.settings && _st.settings.theme) || "night");
}catch(e){ document.documentElement.setAttribute("data-theme","night"); }
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <path d="M4 22 L11.4 4 M22 22 L14.6 4" stroke="#4d5a67" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M6.2 17.5h13.6M7.6 13.8h10.8M9 10.1h8" stroke="#3a4653" stroke-width="1.2" stroke-linecap="round"/>
        <rect x="9.6" y="6.6" width="6.8" height="4.6" rx="2" fill="#e6a340"/>
      </svg>
      <b>Focus Train</b><i>National Network</i>
    </div>
    <div class="chips">
      <div class="chip pts"><b id="hPts">0</b><span>points</span></div>
      <div class="chip"><b id="hStreak">0</b><span>streak</span></div>
      <div class="chip"><b id="hRides">0</b><span>arrivals</span></div>
    </div>
    <div class="iconbar">
      <button class="ib" id="bStats" title="Journey log" aria-label="Journey log">
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M2.5 15.5h13"/><path d="M5 15.5V9"/><path d="M9 15.5V4.5"/><path d="M13 15.5v-4"/>
        </svg>
      </button>
      <button class="ib" id="bAmb" title="Ambience" aria-label="Ambience">
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.2 6.9H2.2v4.2h2L7.6 14V4L4.2 6.9Z"/>
          <path d="M10.6 6.6a3.4 3.4 0 0 1 0 4.8"/>
          <path d="M13 4.2a6.8 6.8 0 0 1 0 9.6"/>
        </svg>
      </button>
      <button class="ib" id="bSet" title="Settings" aria-label="Settings">
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="9" cy="9" r="2.6"/>
          <path d="M9 1.6v2.1M9 14.3v2.1M16.4 9h-2.1M3.7 9H1.6M14.2 3.8l-1.5 1.5M5.3 12.7l-1.5 1.5M14.2 14.2l-1.5-1.5M5.3 5.3 3.8 3.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="stage">
    <svg id="map" preserveAspectRatio="xMidYMid meet" aria-label="Route map"></svg>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <div class="console" id="console"></div>
</div>

<div class="grain"></div>
<div class="scrim" id="scrim"></div>

<aside class="panel" id="statsPanel" aria-hidden="true">
  <header><h3>Journey Log</h3></header>
  <div class="body" id="statsBody"></div>
</aside>

<aside class="panel" id="ambPanel" aria-hidden="true">
  <header><h3>Ambience</h3></header>
  <div class="body" id="ambBody"></div>
</aside>

<aside class="panel" id="setPanel" aria-hidden="true">
  <header><h3>Settings</h3></header>
  <div class="body" id="setBody"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
